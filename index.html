<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#250832">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<title>Diwali Family Card 🪔</title>
<meta name="description" content="Add your wish, light your diya, and pass it on to the family.">
<meta property="og:title" content="A Diwali card is waiting for your light 🪔">
<meta property="og:description" content="Add your wish, light your diya, and pass it on to the family.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  button,a,.chip{touch-action:manipulation}
  html,body{min-height:100%}
  body{font-family:'Poppins',system-ui,sans-serif;color:#fff4dc;
    background:radial-gradient(ellipse at 50% 0%,#4a1048 0%,#250832 45%,#0d0216 100%) fixed;
    display:flex;flex-direction:column;align-items:center;padding:28px 14px calc(60px + env(safe-area-inset-bottom))}
  #sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  #app{position:relative;z-index:1;width:100%;max-width:460px}

  .card{position:relative;background:linear-gradient(160deg,rgba(110,20,60,.95),rgba(50,8,45,.97));
    border:2px solid rgba(255,204,77,.55);border-radius:26px;padding:58px 22px 26px;
    box-shadow:0 0 40px rgba(255,140,26,.25),inset 0 0 30px rgba(255,204,77,.08);
    overflow:hidden;animation:rise .8s ease both}
  .card.complete{animation:rise .8s ease both,glow 2.5s ease-in-out infinite alternate}

  /* marigold toran */
  .toran{position:absolute;top:-4px;left:0;right:0;display:flex;justify-content:space-between;padding:0 4px}
  .toran i{position:relative;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ffd66b,#ff8c1a 60%,#c9530a);
    box-shadow:0 2px 4px rgba(0,0,0,.35);transform:translateY(var(--y));
    animation:sway 3s ease-in-out var(--d) infinite alternate}
  .toran i.y{background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc72c 60%,#d99a00)}
  .toran i.leaf::after{content:'';position:absolute;left:50%;top:17px;width:9px;height:16px;
    background:linear-gradient(#3fae5a,#1f7a3a);border-radius:0 100% 0 100%;transform:translateX(-50%) rotate(45deg)}

  .head{position:relative;text-align:center;padding:16px 0 6px}
  .rangoli{position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);opacity:.32;pointer-events:none}
  .rangoli svg{width:100%;height:100%;animation:spin 50s linear infinite}
  h1{position:relative;font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:2.5rem;line-height:1.1;
    background:linear-gradient(180deg,#fff2b0,#ffcc4d 50%,#ff9f1a);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 0 12px rgba(255,180,50,.5))}
  .fam{position:relative;margin-top:6px;opacity:.92;letter-spacing:.4px}
  .fam b{color:#ffcc4d}
  .intro{font-size:.88rem;text-align:center;opacity:.9;line-height:1.55;margin-top:14px}
  .banner{text-align:center;font-family:'Yatra One',serif;font-size:1.2rem;color:#fff2b0;margin-top:10px;animation:pop .8s both}

  /* diyas */
  .diyas{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px 6px;margin:22px 0 12px}
  .diya{text-align:center;font-size:.72rem;min-width:0}
  .diya svg{width:56px;height:66px;overflow:visible;display:block;margin:0 auto}
  .diya svg *{transform-box:view-box}
  .diya .bowl{filter:grayscale(.75) brightness(.55);transition:filter 1s}
  .diya.lit .bowl{filter:none}
  .diya .fl{transform-origin:30px 34px;transform:scale(0);opacity:0;transition:transform .7s cubic-bezier(.3,1.8,.5,1),opacity .4s}
  .diya.lit .fl{transform:scale(1);opacity:1}
  .diya .fl path{transform-origin:30px 34px;animation:flick .16s ease-in-out infinite alternate}
  .diya .fl path+path{animation-duration:.21s}
  .diya .halo{opacity:0;transition:opacity 1.2s}
  .diya.lit .halo{opacity:1;animation:pulse 2.4s ease-in-out infinite}
  .diya span{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffe3a3}
  .diya:not(.lit) span{opacity:.45}

  .prog{height:8px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden}
  .prog i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#ff8c1a,#ffcc4d);
    box-shadow:0 0 10px #ffcc4d;transition:width 1s .8s}
  .prog-label{text-align:center;font-size:.8rem;margin-top:8px;opacity:.85}

  .wishes{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
  .wishes li{background:rgba(0,0,0,.22);border:1px solid rgba(255,204,77,.18);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
  .wishes li.new{animation:pop .7s 1s both}
  .wishes li em{font-style:normal;font-size:1.1rem;line-height:1.3}
  .wishes b{color:#ffcc4d;font-size:.85rem}
  .wishes p{font-size:.88rem;line-height:1.45;overflow-wrap:anywhere}

  /* forms */
  h3{font-family:'Yatra One',serif;font-weight:400;color:#ffcc4d;font-size:1.3rem;text-align:center}
  .turn{margin-top:20px;padding-top:16px;border-top:1px dashed rgba(255,204,77,.35)}
  form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:#ffd98a}
  input,textarea{font:inherit;font-size:16px;color:#fff;background:rgba(0,0,0,.3);border:1px solid rgba(255,204,77,.35);
    border-radius:12px;padding:10px 12px;outline:none;resize:none}
  input:focus,textarea:focus{border-color:#ffcc4d;box-shadow:0 0 0 3px rgba(255,204,77,.18)}
  input::placeholder,textarea::placeholder{color:rgba(255,244,220,.4)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
  .chip{font:inherit;font-size:.72rem;color:#ffe3a3;background:rgba(255,204,77,.1);border:1px solid rgba(255,204,77,.3);
    border-radius:999px;padding:5px 10px;cursor:pointer}
  .chip:hover{background:rgba(255,204,77,.22)}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,204,77,.5);background:rgba(0,0,0,.25);
    color:#ffcc4d;font-size:1.3rem;cursor:pointer}
  .stepper output{font-size:1.4rem;font-weight:600;min-width:2ch;text-align:center;color:#fff}

  .btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;transition:transform .15s}
  .btn:active{transform:scale(.96)}
  .primary{background:linear-gradient(90deg,#ff8c1a,#ffcc4d);color:#3a0a1e;box-shadow:0 6px 20px rgba(255,140,26,.4)}
  .wa{background:#25d366;color:#05301a}
  .ghost{background:transparent;color:#ffcc4d;border:1px solid rgba(255,204,77,.5)}
  .share{margin-top:20px;text-align:center;padding:16px;border-radius:18px;background:rgba(255,204,77,.08);
    border:1px dashed rgba(255,204,77,.4);animation:pop .6s 1.1s both}
  .share p{font-size:.85rem;opacity:.9;margin-top:4px;line-height:1.5}
  .share-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .note{font-size:.72rem;opacity:.7;margin-top:10px;line-height:1.4}
  .link{display:block;margin:12px auto 0;background:none;border:0;color:#ffcc4d;text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer}
  /* guidance for whoever receives the card */
  .guide{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:rgba(10,0,20,.65);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .4s both}
  .guide.out{opacity:0;transition:opacity .3s}
  .guide-box{width:100%;max-width:360px;background:linear-gradient(160deg,#6e143c,#32082d);border:2px solid rgba(255,204,77,.6);
    border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 0 50px rgba(255,140,26,.4);animation:pop .5s .1s both}
  .guide-diya{font-size:2.6rem;line-height:1.2}
  .guide p{font-size:.9rem;line-height:1.5;margin-top:6px}
  .guide ol{list-style:none;padding:0;margin:16px 0 18px;text-align:left;display:flex;flex-direction:column;gap:8px}
  .guide li{display:flex;gap:10px;align-items:center;font-size:.92rem;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
  .guide li b{flex:none;width:26px;height:26px;border-radius:50%;background:#ffcc4d;color:#3a0a1e;display:grid;place-items:center;font-size:.85rem}
  .guide .btn{width:100%;font-size:1.05rem}
  .cta{display:block;margin:16px auto 0;font-size:1.05rem;animation:ctaPulse 1.8s ease-in-out infinite}
  .diya.next{cursor:pointer}
  .diya.next svg{animation:nextPulse 1.6s ease-in-out infinite}
  .diya.next .bowl{filter:grayscale(.2) brightness(.9)}
  .diya.next span{color:#ffcc4d;opacity:1;font-weight:600}
  .step-tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#3a0a1e;
    background:#ffcc4d;border-radius:999px;padding:3px 10px;margin-bottom:6px}
  .flow{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 0;font-size:.82rem;flex-wrap:wrap}
  .fs{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:999px;border:1px solid rgba(255,204,77,.3);opacity:.55}
  .fs b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,204,77,.25);font-size:.75rem}
  .fs.on{opacity:1;background:rgba(255,204,77,.15);border-color:#ffcc4d;box-shadow:0 0 14px rgba(255,204,77,.35);animation:ctaPulse 1.8s ease-in-out infinite}
  .fs.on b{background:#ffcc4d;color:#3a0a1e}
  .fs.done{opacity:.95}
  .fs.done b{background:#2f9e6e;color:#fff}
  .flow i{width:16px;height:2px;background:rgba(255,204,77,.45)}
  .other{display:block;width:100%;margin-top:12px}

  /* the empty diya that's waiting for you */
  .diya{position:relative}
  .diya.next::before{content:'Tap me!';position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;
    font-size:.64rem;font-weight:600;color:#3a0a1e;background:#ffcc4d;border-radius:8px;padding:2px 7px;box-shadow:0 0 10px rgba(255,204,77,.6)}
  .diya .tap{position:absolute;left:58%;top:38px;font-style:normal;font-size:1.5rem;pointer-events:none;animation:tapHint 1.1s ease-in-out infinite}

  /* sticky bottom action bar */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:8px;align-items:center;justify-content:center;
    padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(13,2,22,0),rgba(13,2,22,.94) 40%);
    transform:translateY(120%);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
  .dock.show{transform:none}
  .dock .btn{flex:1;max-width:330px;font-size:1.05rem;padding:15px 18px}
  .dock .icon{flex:none;width:52px;padding:15px 0}
  .dock .hand{font-size:1.7rem;animation:handPoke 1s ease-in-out infinite}
  .dock .bump{animation:bump .6s ease}
  body.has-dock{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  .fly{position:fixed;z-index:9;font-size:2.2rem;margin:-1.1rem 0 0 -1.1rem;pointer-events:none;filter:drop-shadow(0 0 12px #ffb000);
    transition:transform 1.1s cubic-bezier(.5,-.4,.5,1),opacity .3s 1s}

  /* bottom sheet with the "light your diya" form */
  .sheet-wrap{position:fixed;inset:0;z-index:9;background:rgba(10,0,20,0);transition:background .3s}
  .sheet-wrap.open{background:rgba(10,0,20,.6)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:500px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow:auto;
    background:linear-gradient(160deg,#6e143c,#32082d);border:2px solid rgba(255,204,77,.55);border-bottom:0;border-radius:24px 24px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,1,.3,1)}
  .sheet-wrap.open .sheet{transform:none}
  .sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,204,77,.45);margin:0 auto 10px}
  .sheet .x{position:absolute;top:8px;right:10px;width:38px;height:38px;background:none;border:0;color:#ffcc4d;font-size:1.2rem;cursor:pointer}
  .sheet .btn.primary{margin-top:4px;font-size:1.05rem;padding:14px}
  .foot{position:relative;z-index:1;text-align:center;margin-top:18px;font-size:.78rem;opacity:.75}
  .foot a{color:#ffcc4d}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:#ffcc4d;color:#3a0a1e;
    padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .3s;z-index:5}
  .toast.show{transform:translate(-50%,0)}

  /* Om medallion in the card header */
  .om{position:relative;width:64px;height:64px;margin:0 auto 4px;display:grid;place-items:center}
  .om::before{content:'';position:absolute;inset:-14px;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,214,90,.55) 0 6deg,transparent 6deg 18deg);
    -webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 32%,transparent 70%);
    animation:spin 14s linear infinite}
  .om span{font-family:'Yatra One',serif;font-size:2.6rem;line-height:1;color:#ffd65a;
    text-shadow:0 0 12px #ffb000,0 0 28px #ff8c1a;animation:omGlow 2.6s ease-in-out infinite}
  .hindi{position:relative;font-family:'Yatra One',serif;color:#ffe3a3;font-size:1.05rem;letter-spacing:1px;margin-bottom:2px}

  /* intro: temple doors open, Om + lotus, Lakshmi's footprints walk in */
  #intro{position:fixed;inset:0;z-index:10;perspective:1400px;overflow:hidden;cursor:pointer;
    background:radial-gradient(circle at 50% 45%,#5a1450 0%,#1c0428 70%);transition:opacity 1s}
  #intro.out{opacity:0;pointer-events:none}
  #intro .aura{position:absolute;left:50%;top:42%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(rgba(255,204,77,.16) 0 7deg,transparent 7deg 20deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);
    opacity:0;transition:opacity 1.5s .8s}
  #intro.open .aura{opacity:1;animation:spinC 30s linear infinite}
  #intro .bless{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;
    transition:transform 1.6s cubic-bezier(.2,1.4,.4,1) .9s,opacity 1.2s .9s}
  #intro.open .bless{transform:translate(-50%,-50%) scale(1);opacity:1}
  #intro .bless svg{width:min(62vw,260px);height:auto;filter:drop-shadow(0 0 24px rgba(255,180,50,.7));overflow:visible}
  #intro .bless .omt{animation:omGlow 2.6s ease-in-out infinite}
  #intro .mantra{font-family:'Yatra One',serif;color:#ffe08a;font-size:clamp(1rem,4.6vw,1.35rem);margin-top:6px;
    text-shadow:0 0 10px rgba(255,160,0,.8);opacity:0}
  #intro.open .mantra{animation:pop 1s forwards}
  #intro.open .mantra:nth-of-type(1){animation-delay:2s}
  #intro.open .mantra:nth-of-type(2){animation-delay:2.6s}
  #intro .step{position:absolute;left:calc(50% + var(--x));bottom:var(--b);width:22px;opacity:0;
    transform:translateX(-50%) rotate(var(--r)) scale(.4)}
  #intro.open .step{animation:stepIn .5s var(--d) forwards}
  #intro .door{position:absolute;top:0;bottom:0;width:50.5%;transition:transform 2s cubic-bezier(.6,0,.3,1) .5s;
    background:
      radial-gradient(circle at var(--hx) 52%,#ffd65a 0 7px,#a8740a 8px 10px,transparent 11px),
      linear-gradient(90deg,transparent 12%,rgba(255,204,77,.5) 12% 13%,transparent 13% 87%,rgba(255,204,77,.5) 87% 88%,transparent 88%),
      linear-gradient(transparent 8%,rgba(255,204,77,.5) 8% 9%,transparent 9% 48%,rgba(255,204,77,.5) 48% 49%,transparent 49% 91%,rgba(255,204,77,.5) 91% 92%,transparent 92%),
      repeating-linear-gradient(90deg,#6b2410 0 18px,#7a2c14 18px 36px);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  #intro .door.l{left:0;transform-origin:left center;--hx:92%;border-right:2px solid #3a1206}
  #intro .door.r{right:0;transform-origin:right center;--hx:8%;border-left:2px solid #3a1206}
  #intro .door b{font-family:'Yatra One',serif;font-weight:400;font-size:clamp(2rem,10vw,3.6rem);color:#ff3b2f;
    text-shadow:0 0 1px #ffd65a,0 2px 0 #5a0a05;transform:translateY(-14vh)}
  #intro.open .door.l{transform:rotateY(-105deg)}
  #intro.open .door.r{transform:rotateY(105deg)}
  #intro .skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:1rem;font-weight:600;color:#ffe3a3;z-index:2;
    text-shadow:0 0 10px #ff8c1a;animation:pulse 1.6s ease-in-out infinite}
  #intro.open .skip{font-size:.75rem;font-weight:400;opacity:.6;animation:none}
  #snd{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:11;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,204,77,.5);background:rgba(30,5,35,.7);font-size:1.2rem;cursor:pointer;backdrop-filter:blur(4px)}

  .finale{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;text-align:center}
  .finale div{font-family:'Yatra One',serif;font-size:clamp(2.6rem,13vw,5rem);line-height:1.15;
    background:linear-gradient(180deg,#fff6c4,#ffcc4d 55%,#ff8c1a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,170,40,.9));animation:finale 4.5s ease forwards}
  .finale small{display:block;font-size:.38em}

  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
  @keyframes glow{to{box-shadow:0 0 70px rgba(255,204,77,.55),inset 0 0 40px rgba(255,204,77,.15)}}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sway{to{transform:translateY(calc(var(--y) + 3px)) rotate(8deg)}}
  @keyframes flick{to{transform:scale(.9,1.07) skewX(3deg)}}
  @keyframes pulse{50%{opacity:.55}}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes tapHint{50%{transform:translateY(-7px)}}
  @keyframes handPoke{50%{transform:translateX(7px)}}
  @keyframes bump{35%{transform:scale(1.14)}70%{transform:scale(.97)}}
  @keyframes ctaPulse{50%{transform:scale(1.05);box-shadow:0 6px 30px rgba(255,180,40,.75)}}
  @keyframes nextPulse{50%{filter:drop-shadow(0 0 10px #ffcc4d);transform:translateY(-3px)}}
  @keyframes flash{25%{box-shadow:0 0 0 3px #ffcc4d,0 0 30px rgba(255,204,77,.5);border-radius:14px}}
  @keyframes spinC{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes omGlow{50%{text-shadow:0 0 20px #ffd000,0 0 46px #ff8c1a;filter:brightness(1.25)}}
  @keyframes stepIn{to{opacity:.9;transform:translateX(-50%) rotate(var(--r)) scale(1)}}
  @keyframes finale{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main id="app"></main>
<audio id="bgm" src="song.m4a" loop preload="auto"></audio>
<p class="foot"><a href="./">Start a card for another family</a></p>
<div class="toast" id="toast"></div>
<button id="snd" type="button" aria-label="Mute music">🔊</button>

<div id="intro" aria-hidden="true">
  <div class="aura"></div>
  <div class="bless">
    <svg viewBox="-110 -120 220 200">
      <g transform="translate(0,48)">
        <g fill="#e2477a" stroke="#ffb3c8" stroke-width="1">
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(-75)"/>
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(-50)"/>
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(-25)"/>
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(25)"/>
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(50)"/>
          <path d="M0 0 C-16 -22 -12 -56 0 -72 C12 -56 16 -22 0 0Z" transform="rotate(75)"/>

          <path d="M0 0 C-14 -20 -10 -48 0 -62 C10 -48 14 -20 0 0Z" transform="rotate(-38)"/>
          <path d="M0 0 C-14 -20 -10 -48 0 -62 C10 -48 14 -20 0 0Z" transform="rotate(38)"/>

<!-- shared gradients for all diyas -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a00"/><stop offset=".5" stop-color="#ffb000"/><stop offset="1" stop-color="#ffe680"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd25a" stop-opacity=".85"/><stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

<script>
const MAX_MEMBERS = 16, MIN_MEMBERS = 2, MAX_NAME = 24, MAX_WISH = 140;
const BOWL_COLORS = ['#c2552d','#d9822b','#b33c5e','#9b4fb8','#2f7fb5','#2f9e6e','#c9a227','#d0496b'];
const WISHES = [
  ['✨ Joy & light', 'May the light of the diyas fill your life with joy and prosperity ✨'],
  ['🍬 Sweet moments', 'Wishing you sweet moments, sweeter laddoos and the sweetest family time 🍬'],
  ['🙏 Blessings', 'May Maa Lakshmi bless our home with health, wealth and happiness 🙏'],
  ['❤️ Missing you', 'Happy Diwali! Missing you all and sending lots and lots of love ❤️'],
  ['🎆 Togetherness', 'Let\'s light up the world with love, laughter and togetherness 🎆'],
];
const LS_KEY = 'diwali-card-lit';

const app = document.getElementById('app');
let state = null;

/* ---------- state <-> URL (UTF-8 safe base64url) ---------- */
function encode(obj) {
  let s = '';
  new TextEncoder().encode(JSON.stringify(obj)).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(str) {
  try {
    const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (typeof o.f !== 'string' || typeof o.i !== 'string' || !Number.isInteger(o.n) || !Array.isArray(o.m)) return null;
    o.n = Math.min(MAX_MEMBERS, Math.max(MIN_MEMBERS, o.n));
    o.m = o.m.filter(x => x && typeof x.n === 'string' && typeof x.w === 'string')
             .slice(0, o.n).map(x => ({ n: x.n.slice(0, MAX_NAME), w: x.w.slice(0, MAX_WISH) }));
    o.f = o.f.slice(0, MAX_NAME);
    return o;
  } catch { return null; }
}
const shareUrl = () => location.origin + location.pathname + '#' + encode(state);
const save = () => history.replaceState(null, '', '#' + encode(state));

const litIds = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } };
function markLit(id) {
  const a = litIds();
  if (!a.includes(id)) { a.push(id); localStorage.setItem(LS_KEY, JSON.stringify(a.slice(-50))); }
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ---------- pieces ---------- */
function toran() {
  const n = 15;
  return '<div class="toran">' + Array.from({ length: n }, (_, k) => {
    const y = Math.sin(Math.PI * k / (n - 1)) * 14;
    return `<i class="${k % 2 ? 'y' : ''} ${k % 3 === 1 ? 'leaf' : ''}" style="--y:${y.toFixed(1)}px;--d:${(k * .17).toFixed(2)}s"></i>`;
  }).join('') + '</div>';
}

function rangoli() {
  let p = '';
  for (let k = 0; k < 16; k++) p += `<ellipse cx="0" cy="-58" rx="11" ry="34" fill="${k % 2 ? '#ff8c1a' : '#ff3d7f'}" transform="rotate(${k * 22.5})"/>`;
  for (let k = 0; k < 8; k++)  p += `<ellipse cx="0" cy="-30" rx="9" ry="20" fill="#ffcc4d" transform="rotate(${k * 45 + 22.5})"/>`;
  for (let k = 0; k < 24; k++) p += `<circle cx="0" cy="-96" r="3" fill="#fff2b0" transform="rotate(${k * 15})"/>`;
  return `<svg viewBox="-100 -100 200 200">${p}<circle r="14" fill="#9b4fb8"/><circle r="7" fill="#ffcc4d"/></svg>`;
}

function header(family) {
  return `${toran()}
  <div class="head">
    <div class="rangoli">${rangoli()}</div>
    <div class="om"><span>ॐ</span></div>
    <p class="hindi">शुभ दीपावली</p>
    <h1>Shubh Deepavali</h1>
    <p class="fam">from the <b id="famName">${esc(family || '____')}</b> family</p>
  </div>`;
}

function diyaSVG(color) {
  return `<svg viewBox="0 0 60 70" aria-hidden="true">
    <circle class="halo" cx="30" cy="26" r="26" fill="url(#halo)"/>
    <g class="fl">
      <path d="M30 6 C37 17 39 24 34.5 30.5 C32.5 33.5 27.5 33.5 25.5 30.5 C21 24 23 17 30 6Z" fill="url(#flame)"/>
      <path d="M30 17 C33 22.5 33.5 27 31.3 29.8 C30.4 30.8 29.4 30.7 28.7 29.8 C27 27 27.5 22 30 17Z" fill="#fff8d0"/>
    </g>
    <rect x="29.2" y="31" width="1.6" height="6" rx=".8" fill="#3a2410"/>
    <g class="bowl">
      <path d="M22 58 L38 58 L35.5 65 L24.5 65Z" fill="${color}"/>
      <path d="M3 38 Q30 35 57 38 Q53 59 30 60.5 Q7 59 3 38Z" fill="${color}"/>
      <ellipse cx="30" cy="38" rx="27" ry="4.6" fill="rgba(0,0,0,.35)"/>
      <ellipse cx="30" cy="38.3" rx="22" ry="2.8" fill="#f2b544" opacity=".7"/>
      <circle cx="18" cy="48" r="1.8" fill="#ffd76a"/><circle cx="30" cy="50" r="1.8" fill="#ffd76a"/><circle cx="42" cy="48" r="1.8" fill="#ffd76a"/>
      <path d="M12 44 Q30 52 48 44" stroke="#ffd76a" stroke-width="1" fill="none" opacity=".8"/>
    </g>
  </svg>`;
}

function wishChips() {
  return '<div class="chips">' + WISHES.map((w, k) => `<button type="button" class="chip" data-wish="${k}">${w[0]}</button>`).join('') + '</div>';
}

function sheetForm() {
  return `<div class="sheet" role="dialog" aria-label="Light your diya">
    <div class="grab"></div>
    <button class="x" type="button" aria-label="Close">✕</button>
    <div style="text-align:center"><span class="step-tag">Step 1 of 2</span></div>
    <h3>Light your diya 🪔</h3>
    <form id="addForm">
      <label>Your name<input name="n" maxlength="${MAX_NAME}" required placeholder="e.g. Dadi, Rohan, Priya…" autocomplete="given-name"></label>
      <label>Your Diwali wish<textarea name="w" maxlength="${MAX_WISH}" rows="3" required placeholder="Write a wish for the family…"></textarea></label>
      ${wishChips()}
      <button class="btn primary">🪔 Light my diya</button>
    </form>
  </div>`;
}

function sharePanel(fresh) {
  const done = state.m.length >= state.n, rem = state.n - state.m.length;
  const last = esc(state.m[state.m.length - 1].n);
  return `<div class="share">
    ${fresh && !done ? '<span class="step-tag">Step 2 of 2</span>' : ''}
    <h3>${done ? 'All diyas are glowing! 🎆' : fresh ? 'Now pass it on 🪔' : 'Pass it on 🪔'}</h3>
    <p>${done
      ? 'The card is complete! Send it to the whole family so everyone can see all the wishes 🎉'
      : `${fresh ? `Your diya is lit, ${last}! ` : '✅ You\'ve already lit your diya on this phone. '}${rem} more ${rem > 1 ? 'diyas' : 'diya'} to go.<br>
         Tap <b>WhatsApp</b> and send it to <b>one</b> family member who hasn't lit a diya yet. They'll add theirs and pass it on.`}</p>
    <div class="share-btns">
      <button class="btn wa" data-act="wa">WhatsApp</button>
      ${navigator.share ? '<button class="btn primary" data-act="share">Share…</button>' : ''}
      <button class="btn ghost" data-act="copy">Copy link</button>
    </div>
    ${location.protocol === 'file:' ? '<p class="note">⚠️ You opened this file from your computer, so the link only works for you. Put the file online (e.g. Netlify Drop or GitHub Pages) before sharing it with family.</p>' : ''}
  </div>`;
}

/* ---------- screens ---------- */
function renderCreate(broken) {
  celebrate(false);
  setDock(null);
  let count = 6;
  app.innerHTML = `<section class="card">${header('')}
    ${broken ? '<p class="banner" style="font-size:.95rem">That card link looks broken 😕. Start a new one below.</p>' : ''}
    <p class="intro">Make a Diwali card for your family. Light the first diya, then pass it on. Each person adds their light and a wish until every diya glows ✨</p>
    <form id="createForm">
      <label>Family name<input name="f" maxlength="${MAX_NAME}" required placeholder="e.g. Sharma"></label>
      <label>How many family members will light a diya?
        <div class="stepper"><button type="button" data-step="-1">−</button><output id="cnt">${count}</output><button type="button" data-step="1">+</button></div>
      </label>
      <label>Your name<input name="n" maxlength="${MAX_NAME}" required placeholder="e.g. Ved" autocomplete="given-name"></label>
      <label>Your Diwali wish<textarea name="w" maxlength="${MAX_WISH}" rows="3" required placeholder="Write a wish for the family…"></textarea></label>
      ${wishChips()}
      <button class="btn primary">🪔 Light the first diya</button>
    </form>
  </section>`;

  const form = app.querySelector('#createForm');
  form.f.addEventListener('input', e => app.querySelector('#famName').textContent = e.target.value.trim() || '____');
  app.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    count = Math.min(MAX_MEMBERS, Math.max(MIN_MEMBERS, count + +b.dataset.step));
    app.querySelector('#cnt').textContent = count;
  });
  form.onsubmit = e => {
    e.preventDefault();
    state = {
      i: Math.random().toString(36).slice(2, 10),
      f: form.f.value.trim(),
      n: count,
      m: [{ n: form.n.value.trim(), w: form.w.value.trim() }],
    };
    markLit(state.i);
    save();
    renderCard({ justLit: 0 });
  };
}

function renderCard({ justLit = null, showForm = false, welcome = false } = {}) {
  const { f, n, m } = state;
  const done = m.length >= n;
  const alreadyLit = litIds().includes(state.i);

  const myTurn = justLit === null && !done && (!alreadyLit || showForm);
  const diyas = Array.from({ length: n }, (_, k) => {
    const on = k < m.length && k !== justLit;
    const next = myTurn && k === m.length;
    const label = k < m.length ? esc(m[k].n) : next ? 'your diya?' : 'waiting…';
    return `<div class="diya ${on ? 'lit' : ''} ${next ? 'next' : ''}" data-k="${k}" ${next ? 'data-act="jump"' : ''}>${diyaSVG(BOWL_COLORS[k % BOWL_COLORS.length])}<span>${label}</span>${next ? '<em class="tap">👆</em>' : ''}</div>`;
  }).join('');

  const wishes = m.map((x, k) =>
    `<li class="${k === justLit ? 'new' : ''}"><em>🪔</em><div><b>${esc(x.n)}</b><p>${esc(x.w)}</p></div></li>`
  ).join('');

  let action;
  if (justLit !== null || done) action = sharePanel(justLit !== null);
  else if (myTurn) action = '';
  else action = sharePanel(false) + '<button class="btn ghost other" data-act="other">🪔 Someone else here wants to light a diya</button>';

  const flow = done ? '' : `<div class="flow" aria-label="${myTurn ? 'Step 1: light your diya' : 'Step 2: pass it on'}">
      <div class="fs ${myTurn ? 'on' : 'done'}"><b>${myTurn ? '1' : '✓'}</b>Light your diya</div><i></i>
      <div class="fs ${myTurn ? '' : 'on'}"><b>2</b>Pass it on</div>
    </div>`;

  app.innerHTML = `<section class="card ${done ? 'complete' : ''}">
    ${header(f)}
    ${flow}
    ${done ? '<p class="banner">✨ The whole family is here! ✨</p>' : ''}
    <div class="diyas">${diyas}</div>
    <div class="prog"><i style="--w:${(justLit !== null ? justLit : m.length) / n * 100}%"></i></div>
    <p class="prog-label">${m.length} of ${n} diyas lit</p>
    ${myTurn ? '<button class="btn primary cta" data-act="jump">🪔 Light your diya</button>' : ''}
    <ul class="wishes">${wishes}</ul>
    ${action}
  </section>`;

  if (justLit !== null) {
    requestAnimationFrame(() => app.querySelector('.prog i').style.setProperty('--w', m.length / n * 100 + '%'));
    ignite(justLit, done);
  } else {
    celebrate(done);
  }

  if (welcome && myTurn) showGuide();


  setDock(done ? 'done' : myTurn ? 'light' : 'pass');
}

function jumpToForm() { openSheet(); }

function closeSheet() {
  const w = document.querySelector('.sheet-wrap');
  if (!w) return;
  w.classList.remove('open');
  setTimeout(() => w.remove(), 400);
}
function openSheet() {
  if (document.querySelector('.sheet-wrap')) return;
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = sheetForm();
  document.body.appendChild(w);
  requestAnimationFrame(() => w.classList.add('open'));
  const form = w.querySelector('form');
  w.addEventListener('click', e => {
    if (e.target === w || e.target.closest('.x')) return closeSheet();
    const chip = e.target.closest('[data-wish]');
    if (chip) { form.w.value = WISHES[chip.dataset.wish][1]; form.w.focus(); }
  });
  form.n.focus();                                   // same tap, so phones open the keyboard
  form.onsubmit = e => {
    e.preventDefault();
    const name = form.n.value.trim(), wish = form.w.value.trim();
    if (state.m.some(x => x.n.toLowerCase() === name.toLowerCase()) &&
        !confirm(`${name} has already lit a diya. Add another one anyway?`)) return;
    state.m.push({ n: name, w: wish });
    markLit(state.i);
    save();
    form.n.blur(); form.w.blur();
    closeSheet();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderCard({ justLit: state.m.length - 1 });
  };
}

const dock = document.createElement('div');
dock.className = 'dock';
document.body.appendChild(dock);
function setDock(mode) {
  document.body.classList.toggle('has-dock', !!mode);
  if (!mode) { dock.classList.remove('show'); return; }
  dock.innerHTML = mode === 'light'
    ? '<span class="hand">👉</span><button class="btn primary" data-dock="light">🪔 Light your diya</button>'
    : mode === 'pass'
    ? `<span class="hand">👉</span><button class="btn wa" data-dock="wa">📲 Pass it on · WhatsApp</button>
       ${navigator.share ? '<button class="btn ghost icon" data-dock="share" aria-label="More ways to share">⋯</button>' : ''}`
    : '<button class="btn primary" data-dock="share">🎉 Share the finished card</button>';
  dock.classList.add('show');
}
dock.addEventListener('click', e => {
  const a = e.target.closest('[data-dock]')?.dataset.dock;
  if (a === 'light') openSheet();
  else if (a === 'wa') shareWhatsApp();
  else if (a === 'share') navigator.share ? shareNative() : shareWhatsApp();
});

// after lighting: a little diya flies from your diya into the WhatsApp button
function flyToDock(el) {
  const btn = dock.querySelector('.btn');
  if (!btn || reduceMotion) return;
  const a = el.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + a.height * .4;
  const f = document.createElement('div');
  f.className = 'fly'; f.textContent = '🪔';
  f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    f.style.transform = `translate(${b.left + b.width / 2 - x0}px, ${b.top + b.height / 2 - y0}px) scale(.5)`;
    f.style.opacity = '0';
  }));
  setTimeout(() => {
    f.remove();
    btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');
    burst(b.left + b.width / 2, b.top, 40, 130, 'peony');
  }, 1150);
}

function showGuide() {
  const { f, n, m } = state;
  const g = document.createElement('div');
  g.className = 'guide';
  g.innerHTML = `<div class="guide-box" role="dialog" aria-label="How this card works">
    <div class="guide-diya">🪔</div>
    <h3>${esc(m[m.length - 1].n)} sent you a Diwali card!</h3>
    <p>The <b>${esc(f)}</b> family is lighting diyas together. ${m.length} of ${n} are already glowing. Now it's your turn:</p>
    <ol>
      <li><b>1</b>Read the family's wishes 💌</li>
      <li><b>2</b>Write your name and a wish ✍️</li>
      <li><b>3</b>Tap “Light my diya” 🪔</li>
      <li><b>4</b>Send it on WhatsApp to the next family member 📲</li>
    </ol>
    <button class="btn primary" type="button">Let's go ✨</button>
  </div>`;
  const close = jump => {
    g.classList.add('out');
    setTimeout(() => g.remove(), 300);
    if (jump) jumpToForm();
  };
  g.querySelector('button').onclick = () => close(true);
  g.addEventListener('click', e => { if (e.target === g) close(false); });
  document.body.appendChild(g);
}

function ignite(k, finale) {
  const el = app.querySelector(`.diya[data-k="${k}"]`);
  setTimeout(() => {
    el.classList.add('lit');
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * .3, 60, 42, 'peony');
    shower(30);
    Sound.chime();
    for (let i = 0; i < 3; i++) setTimeout(rocket, 400 + i * 350);
    if (finale) grandFinale();
    else setTimeout(() => flyToDock(el), 1300);
  }, 700);
}

/* ---------- sharing ---------- */
function shareText() {
  const rem = state.n - state.m.length;
  return rem > 0
    ? `🪔 ${state.m[state.m.length - 1].n} just lit a diya in the ${state.f} family Diwali card! ${rem} more ${rem > 1 ? 'diyas' : 'diya'} to go.\n\n👉 Open the link, write your wish, light your diya, then send it to the next family member:`
    : `✨ The ${state.f} family Diwali card is complete! All ${state.n} diyas are lit. Happy Diwali! 🎆`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

function shareWhatsApp() {
  window.open('https://wa.me/?text=' + encodeURIComponent(shareText() + '\n' + shareUrl()), '_blank');
}
async function shareNative() {
  try { await navigator.share({ title: 'Diwali Family Card 🪔', text: shareText(), url: shareUrl() }); } catch {}
}
async function copyLink() {
  const url = shareUrl();
  try { await navigator.clipboard.writeText(url); toast('Link copied! 🪔'); }
  catch { prompt('Copy this link:', url); }
}

app.addEventListener('click', async e => {
  const chip = e.target.closest('[data-wish]');
  if (chip) {
    const ta = chip.closest('form').querySelector('textarea');
    ta.value = WISHES[chip.dataset.wish][1]; ta.focus();
    return;
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'jump') return openSheet();
  if (act === 'share') shareNative();
  else if (act === 'wa') shareWhatsApp();
  else if (act === 'copy') copyLink();
  else if (act === 'other') { renderCard({ showForm: true }); openSheet(); }
});

/* ---------- sound: raag Bhupali on bansuri + tanpura + tabla, all synthesized ---------- */
const Sound = (() => {
  const SA = 146.83;                                   // Sa = D3
  const R = { S: 1, R: 9 / 8, G: 5 / 4, P: 3 / 2, D: 5 / 3 };
  // flute range: low Pa .. high Ga (raag Bhupali: S R G P D)
  const NOTES = [R.P / 2, R.D / 2, R.S, R.R, R.G, R.P, R.D, 2, 2 * R.R, 2 * R.G].map(r => SA * 2 * r);
  const HOME = [2, 5, 7];                              // phrases resolve on Sa, Pa or upper Sa
  const BEAT = 60 / 80;
  // Keherwa: dha ge na ti | na ka dhi na
  const THEKA = ['dha', 'ge', 'na', 'ti', 'na', 'ti', 'dha', 'na'];
  const TANPURA = [SA * .75, SA, SA, SA / 2];

  let ctx, master, music, verb, noiseBuf, on = localStorage.getItem('diwali-sound') !== 'off';
  let started = false, synthWanted = false, nextBeat = 0, beat = 0, nextNote = 0, phrase = [], note = 4, lastBoom = 0;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = on ? .9 : 0;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    music = ctx.createGain(); music.gain.value = 0; music.connect(master);
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
    verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = .3; verb.connect(vg); vg.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    document.addEventListener('visibilitychange', () => document.hidden ? ctx.suspend() : ctx.resume());
  }

  // sounds scheduled while the context is still starting up simply play once it's running
  const ready = () => ctx && ctx.state !== 'closed' && on;
  function out(node, bus, wet) {
    node.connect(bus);
    if (wet) { const s = ctx.createGain(); s.gain.value = wet; node.connect(s); s.connect(verb); }
  }
  function env(t, peak, attack, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
    return g;
  }
  function osc(type, f, t, stop, dest) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    o.connect(dest); o.start(t); o.stop(stop); return o;
  }
  function noise(t, dur, dest) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    s.connect(dest); s.start(t, Math.random() * .5); s.stop(t + dur); return s;
  }

  /* instruments */
  function tanpura(f, t) {
    const g = env(t, .045, .04, 3.4);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 5;
    lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(450, t + 3);
    osc('sawtooth', f, t, t + 3.5, lp); osc('sawtooth', f * 1.004, t, t + 3.5, lp);
    lp.connect(g); out(g, music, .4);
  }
  function flute(f, from, t, dur) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.11, t + .08);
    g.gain.setValueAtTime(.1, t + dur * .75);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + .35);
    const o = osc('sine', f, t, t + dur + .4, g);
    const h = ctx.createGain(); h.gain.value = .12;
    const o2 = osc('triangle', f * 2, t, t + dur + .4, h); h.connect(g);
    if (from) {                                        // meend: glide in from the previous note
      o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(f, t + .12);
      o2.frequency.setValueAtTime(from * 2, t); o2.frequency.exponentialRampToValueAtTime(f * 2, t + .12);
    }
    if (dur > .6) {                                    // vibrato grows on long notes
      const lfo = ctx.createOscillator(); lfo.frequency.value = 5.3;
      const depth = ctx.createGain(); depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(f * .01, t + dur * .7);
      lfo.connect(depth); depth.connect(o.frequency); lfo.start(t); lfo.stop(t + dur + .4);
    }
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 2;
    const breath = env(t, .012, .05, dur * .8); noise(t, dur + .2, bp); bp.connect(breath); breath.connect(g);
    out(g, music, .55);
  }
  function bayan(t, v) {
    const g = env(t, .3 * v, .005, .5);
    const o = osc('sine', 105, t, t + .6, g);
    o.frequency.setValueAtTime(105, t); o.frequency.exponentialRampToValueAtTime(62, t + .4);
    out(g, music, .1);
  }
  function dayan(t, v) {
    const g = env(t, .09 * v, .003, .22);
    osc('triangle', SA * 4, t, t + .3, g); osc('sine', SA * 8.1, t, t + .3, g);
    out(g, music, .15);
  }
  function tik(t, v) {
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const g = env(t, .05 * v, .002, .06); noise(t, .08, hp); hp.connect(g); out(g, music, .05);
  }
  const STROKE = { dha: (t, v) => { bayan(t, v); dayan(t, v); }, ge: bayan, na: dayan, ti: tik };

  /* melody: random walk over the raag, phrases resolving home */
  function makePhrase() {
    const p = [], n = 5 + (Math.random() * 5 | 0);
    for (let i = 0; i < n; i++) {
      const step = [-2, -1, -1, 1, 1, 2, 0][Math.random() * 7 | 0];
      note = Math.max(0, Math.min(NOTES.length - 1, note + step));
      p.push({ n: note, len: [.5, .5, 1, 1, 1, 2][Math.random() * 6 | 0] });
    }
    note = HOME[Math.random() * HOME.length | 0];
    p.push({ n: note, len: 3 }, { rest: true, len: 1 + (Math.random() * 3 | 0) });
    return p;
  }

  function schedule() {
    if (!ready() || !synthWanted) return;
    const now = ctx.currentTime, ahead = now + .6;
    if (nextBeat < now) nextBeat = nextNote = now + .1;  // recovering after being paused
    while (nextBeat < ahead) {
      const b = beat % 8;
      STROKE[THEKA[b]](nextBeat, b === 0 ? 1.15 : .8);
      if (b % 2 === 0) tanpura(TANPURA[(b / 2) | 0], nextBeat);
      nextBeat += BEAT; beat++;
    }
    let prev = null;
    while (nextNote < ahead) {
      if (!phrase.length) phrase = makePhrase();
      const ev = phrase.shift(), dur = ev.len * BEAT;
      if (!ev.rest) { flute(NOTES[ev.n], prev, nextNote, dur * .95); prev = NOTES[ev.n]; }
      nextNote += dur;
    }
  }

  function startMusic() {
    nextBeat = nextNote = ctx.currentTime + .3;
    phrase = [{ n: 2, len: 1 }, { n: 3, len: 1 }, { n: 4, len: 1 }, { n: 5, len: 2 }, { n: 4, len: 1 }, { n: 3, len: .5 }, { n: 2, len: 2.5 }, { rest: true, len: 2 }];
    music.gain.setValueAtTime(0, ctx.currentTime);
    music.gain.linearRampToValueAtTime(1, ctx.currentTime + 4);
    setInterval(schedule, 120);
  }

  /* sound effects */
  function bell(t = ctx.currentTime, f = SA * 8, v = 1) {
    [[1, 1, 4], [2.76, .5, 2.5], [5.4, .3, 1.6], [8.93, .18, 1], [13.3, .1, .6]].forEach(([r, a, d]) => {
      const g = env(t, .08 * v * a, .003, d); osc('sine', f * r, t, t + d + .1, g); out(g, master, .6);
    });
  }
  function boom(crackle, vol = 1) {
    const t = ctx.currentTime;
    if (t - lastBoom < .12) return;
    lastBoom = t;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(60, t + 1);
    const g = env(t, .5 * vol, .01, 1.3); noise(t, 1.4, lp); lp.connect(g); out(g, master, .5);
    if (crackle) for (let i = 0; i < 26; i++) {
      const ct = t + .5 + Math.random() * 1.1, hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      const cg = env(ct, .07 * vol, .001, .03); noise(ct, .05, hp); hp.connect(cg); out(cg, master, .3);
    }
  }

  return {
    unlock() {
      init();
      if (!ctx) return;
      if (ctx.state !== 'running') ctx.resume();
      if (synthWanted && !started) { started = true; startMusic(); }
    },
    toggle() {
      on = !on;
      localStorage.setItem('diwali-sound', on ? 'on' : 'off');
      if (ctx) master.gain.setTargetAtTime(on ? .9 : 0, ctx.currentTime, .15);
      if (on) this.unlock();
      return on;
    },
    get on() { return on; },
    bell(v = 1) { if (ready()) { bell(ctx.currentTime, SA * 8, v); bell(ctx.currentTime + .9, SA * 8, v * .8); } },
    chime() {
      if (!ready()) return;
      const t = ctx.currentTime;
      [R.S, R.G, R.P, 2, 2 * R.G].forEach((r, i) => bell(t + i * .09, SA * 4 * r, .45));
    },
    boom(crackle, vol = .25) { if (ready()) boom(crackle, vol); },
    useSynth(v) {
      synthWanted = v;
      if (!ctx) return;
      if (v && !started) { started = true; startMusic(); }
      else if (started) music.gain.setTargetAtTime(v ? 1 : 0, ctx.currentTime, .6);
    },
    fizz(dur) {
      if (!ready()) return;
      const t = ctx.currentTime, d = dur / 1000;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t + .2);
      g.gain.setValueAtTime(.06, t + d - .4); g.gain.linearRampToValueAtTime(0, t + d);
      noise(t, d, hp); hp.connect(g); out(g, master, .2);
    },
  };
})();

/* ---------- sky: stars, embers, lanterns, petals, coins, fireworks ---------- */
const sky = document.getElementById('sky'), g = sky.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const HUES = [45, 30, 330, 280, 190, 130, 0, 50, 300];
const pick = a => a[Math.random() * a.length | 0];
const rnd = (a, b) => a + Math.random() * (b - a);
let W, H;
const stars = [], embers = [], sparks = [], rockets = [], petals = [], lanterns = [], emitters = [];

function resize() {
  W = innerWidth; H = innerHeight;
  sky.width = W * dpr; sky.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random() * .8, r: rnd(.3, 1.6), p: rnd(0, 6.28) });
const newEmber = anyY => ({ x: rnd(0, W), y: anyY ? rnd(0, H) : H + 10, v: rnd(.25, .85), r: rnd(.6, 2.4), p: rnd(0, 6.28) });
for (let i = 0; i < 30; i++) embers.push(newEmber(true));
const newLantern = anyY => ({ x: rnd(0, W), y: anyY ? rnd(H * .2, H) : H + 40, v: rnd(.18, .45), s: rnd(9, 18), p: rnd(0, 6.28) });
for (let i = 0; i < 8; i++) lanterns.push(newLantern(true));

const MAX_SPARKS = innerWidth < 600 ? 1400 : 2600;
function spark(x, y, vx, vy, hue, o = {}) {
  if (sparks.length >= MAX_SPARKS) return;
  sparks.push({ x, y, px: x, py: y, vx, vy, hue, life: 1,
    decay: o.decay ?? rnd(.008, .02), grav: o.grav ?? .045, drag: o.drag ?? .98,
    light: o.light ?? 62, size: o.size ?? 2, crackle: !!o.crackle });
}

// firework shapes: peony, ring, willow (golden rain), crackle, double
function burst(x, y, count = 90, hue = pick(HUES), type) {
  if (reduceMotion) return;
  type ??= pick(['peony', 'peony', 'ring', 'willow', 'crackle', 'double']);
  Sound.boom(type === 'crackle' || type === 'willow');
  if (type === 'ring') {
    const tilt = rnd(.35, 1), s = rnd(3, 4.2);
    for (let i = 0; i < count; i++) {
      const a = i / count * 6.283;
      spark(x, y, Math.cos(a) * s, Math.sin(a) * s * tilt, hue, { decay: rnd(.01, .014) });
    }
    for (let i = 0; i < 20; i++) spark(x, y, rnd(-1, 1), rnd(-1, 1), 50, { light: 85, size: 1.4 });
  } else if (type === 'willow') {
    for (let i = 0; i < count * 1.3; i++) {
      const a = rnd(0, 6.283), s = rnd(.5, 3.4);
      spark(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(38, 48), { decay: rnd(.004, .008), grav: .025, drag: .985, light: 58, size: 1.6 });
    }
  } else if (type === 'double') {
    const h2 = pick(HUES);
    for (let i = 0; i < count; i++) {
      const a = rnd(0, 6.283), s = rnd(3, 5);
      spark(x, y, Math.cos(a) * s, Math.sin(a) * s, hue);
      spark(x, y, Math.cos(a) * s * .45, Math.sin(a) * s * .45, h2, { decay: rnd(.012, .02) });
    }
  } else {
    for (let i = 0; i < count; i++) {
      const a = rnd(0, 6.283), s = rnd(1, 5);
      spark(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rnd(-12, 12), { crackle: type === 'crackle' });
    }
  }
}

function rocketTo(x, ty) {
  if (reduceMotion) return;
  rockets.push({ x, y: H, vx: rnd(-.4, .4), vy: -Math.sqrt(2 * .1 * Math.max(60, H - ty)), hue: pick(HUES) });
}
const rocket = () => rocketTo(W * rnd(.1, .9), H * rnd(.08, .4));

// anaar (fountain) and chakri (spinning wheel)
function emitter(type, x, y, dur) {
  if (reduceMotion) return;
  emitters.push({ type, x, y, until: performance.now() + dur, a: 0 });
  Sound.fizz(dur);
}

// marigold petals, rose petals and gold coins falling (pushpa vrishti)
function newPetal(top) {
  const coin = Math.random() < .3;
  return { x: rnd(0, W), y: top ? rnd(-H * .6, -10) : rnd(-H, H), vx: rnd(-.4, .4), vy: coin ? rnd(1.6, 2.6) : rnd(.6, 1.4),
    rot: rnd(0, 6.28), vr: rnd(-.05, .05), sz: coin ? rnd(5, 8) : rnd(4, 7), coin, flip: rnd(0, 6.28),
    color: coin ? null : pick(['#ff9f1a', '#ffc72c', '#ff5e3a', '#e2477a']) };
}
for (let i = 0; i < 14; i++) petals.push({ ...newPetal(false), ambient: true });
function shower(n = 60) { if (!reduceMotion) for (let i = 0; i < n; i++) petals.push(newPetal(true)); }

setInterval(() => !document.hidden && rocket(), 3500);
let celebrateTimer = null;
function celebrate(on) {
  clearInterval(celebrateTimer);
  celebrateTimer = on ? setInterval(() => {
    if (document.hidden) return;
    rocket();
    if (Math.random() < .3) emitter('anaar', W * pick([.1, .9]), H, 2500);
  }, 900) : null;
}
function grandFinale() {
  const f = document.createElement('div');
  f.className = 'finale';
  f.innerHTML = '<div>शुभ दीपावली<small>The whole family is together ✨</small></div>';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 4700);
  shower(120);
  emitter('anaar', W * .12, H, 6000);
  emitter('anaar', W * .88, H, 6000);
  emitter('chakri', W * .5, H - 40, 5500);
  for (let i = 0; i < 18; i++) setTimeout(rocket, 200 + i * 230);
  setTimeout(() => celebrate(true), 4500);
}

// tap the sky for a firework
document.addEventListener('pointerdown', e => {
  if (document.getElementById('intro') || e.target.closest('.card, .dock, .sheet-wrap, .guide, button, a, input, textarea')) return;
  rocketTo(e.clientX, e.clientY);
});

function drawLantern(l) {
  const x = l.x + Math.sin(t * .8 + l.p) * 8, y = l.y, s = l.s;
  const glow = g.createRadialGradient(x, y, 0, x, y, s * 3);
  glow.addColorStop(0, 'rgba(255,170,60,.45)'); glow.addColorStop(1, 'rgba(255,120,0,0)');
  g.fillStyle = glow; g.globalAlpha = .8 + .2 * Math.sin(t * 3 + l.p);
  g.beginPath(); g.arc(x, y, s * 3, 0, 7); g.fill();
  g.globalAlpha = .9;
  g.fillStyle = '#ff7a1a';
  g.beginPath(); g.moveTo(x - s * .55, y - s * .8); g.lineTo(x + s * .55, y - s * .8);
  g.lineTo(x + s * .7, y + s * .8); g.lineTo(x - s * .7, y + s * .8); g.closePath(); g.fill();
  g.fillStyle = '#ffe08a';
  g.fillRect(x - s * .3, y - s * .2, s * .6, s * .7);
}

function drawPetal(p) {
  g.save(); g.translate(p.x, p.y);
  if (p.coin) {
    const sx = Math.cos(p.flip);
    g.scale(Math.abs(sx) < .15 ? .15 : sx, 1);
    g.fillStyle = sx > 0 ? '#ffcc33' : '#d9a21b';
    g.beginPath(); g.arc(0, 0, p.sz, 0, 7); g.fill();
    g.strokeStyle = '#fff1a8'; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, p.sz * .65, 0, 7); g.stroke();
  } else {
    g.rotate(p.rot); g.fillStyle = p.color;
    g.beginPath(); g.ellipse(0, 0, p.sz, p.sz * .55, 0, 0, 7); g.fill();
  }
  g.restore();
}

let t = 0;
function frame() {
  t += .016;
  const now = performance.now();
  g.clearRect(0, 0, W, H);

  g.fillStyle = '#fff';
  for (const s of stars) {
    g.globalAlpha = .3 + .7 * Math.abs(Math.sin(t * .8 + s.p));
    g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 7); g.fill();
  }
  for (let i = 0; i < lanterns.length; i++) {
    if (!reduceMotion) lanterns[i].y -= lanterns[i].v;
    if (lanterns[i].y < -40) lanterns[i] = newLantern(false);
    drawLantern(lanterns[i]);
  }
  g.fillStyle = '#ffc94d';
  for (let i = 0; i < embers.length; i++) {
    const e = embers[i];
    if (!reduceMotion) { e.y -= e.v; e.x += Math.sin(t + e.p) * .3; }
    if (e.y < -10) embers[i] = newEmber(false);
    g.globalAlpha = .35 + .3 * Math.sin(t * 2 + e.p);
    g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.fill();
  }

  g.globalCompositeOperation = 'lighter';
  for (let i = emitters.length - 1; i >= 0; i--) {
    const m = emitters[i];
    if (now > m.until) { emitters.splice(i, 1); continue; }
    if (m.type === 'anaar') {
      for (let k = 0; k < 7; k++) spark(m.x + rnd(-4, 4), m.y, rnd(-1.4, 1.4), -rnd(6, 10.5), rnd(35, 55), { grav: .14, decay: rnd(.012, .022), light: rnd(60, 85), size: 1.6 });
    } else {
      m.a += .38;
      for (let k = 0; k < 3; k++) {
        const a = m.a + k * 2.094;
        spark(m.x + Math.cos(a) * 10, m.y + Math.sin(a) * 10, -Math.sin(a) * 4.5, Math.cos(a) * 4.5, pick([20, 45, 0, 300]), { grav: .06, decay: .035, light: 70, size: 1.6 });
      }
    }
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx; r.y += r.vy; r.vy += .1;
    spark(r.x, r.y, rnd(-.3, .3), rnd(0, .8), 40, { decay: .05, grav: .02, light: 70, size: 1.4 });
    if (r.vy > -1.2) { burst(r.x, r.y, 90, r.hue); rockets.splice(i, 1); }
  }
  g.lineCap = 'round';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.px = p.x; p.py = p.y;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0 || p.y > H + 20) { sparks.splice(i, 1); continue; }
    let alpha = p.life, light = p.light;
    if (p.crackle && p.life < .5) { alpha = Math.random() < .5 ? 1 : .1; light = 90; }
    g.globalAlpha = alpha; g.strokeStyle = `hsl(${p.hue},100%,${light}%)`; g.lineWidth = p.size;
    g.beginPath(); g.moveTo(p.px - p.vx * 2, p.py - p.vy * 2); g.lineTo(p.x, p.y); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';

  g.globalAlpha = 1;
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    if (!reduceMotion) { p.x += p.vx + Math.sin(t * 2 + p.flip) * .4; p.y += p.vy; p.rot += p.vr; p.flip += .08; }
    if (p.y > H + 20) {
      if (p.ambient) Object.assign(p, newPetal(true), { ambient: true }); else { petals.splice(i, 1); continue; }
    }
    drawPetal(p);
  }
  requestAnimationFrame(frame);
}
frame();

function playIntro(done) {

  const steps = document.getElementById('steps');
  steps.innerHTML = Array.from({ length: 8 }, (_, k) => {
    const left = k % 2 === 0;
    return `<div class="step" style="--x:${left ? -16 : 16}px;--b:${4 + k * 4.2}vh;--r:${left ? -6 : 6}deg;--d:${1.6 + k * .32}s">${footSVG(!left)}</div>`;
  }).join('');
  let opened = false, finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    intro.classList.add('out');
    setTimeout(() => intro.remove(), 1000);
    done();
  };
  // doors wait for a tap (that tap also starts the music), or open by themselves after 5s
  const open = () => {
    if (opened) return;
    opened = true;
    intro.classList.add('open');
    intro.querySelector('.skip').textContent = 'tap to enter';
    Sound.bell();
    setTimeout(() => { burst(W * .25, H * .2, 80, 45, 'willow'); burst(W * .75, H * .22, 80, 330, 'ring'); }, 1300);
    setTimeout(() => shower(40), 2200);
    setTimeout(finish, 5600);
  };
  intro.addEventListener('click', () => opened ? finish() : open());
  setTimeout(open, 5000);
}

/* ---------- boot ---------- */
function init() {
  const h = location.hash.slice(1);
  state = h ? decode(h) : null;
  if (state) renderCard({ welcome: true }); else renderCreate(!!h);
}
addEventListener('hashchange', init);
playIntro(init);
</script>
</body>
</html>
